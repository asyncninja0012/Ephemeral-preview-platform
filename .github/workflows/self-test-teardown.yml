name: Self-test teardown

on:
  pull_request:
    types: [closed]

jobs:
  teardown:
    runs-on: [self-hosted, preview]
    steps:
      - uses: actions/checkout@v4

      - uses: ./actions/teardown-preview
        with:
          pr-number: ${{ github.event.pull_request.number }}
          compose-file: examples/reference-app/docker-compose.yml
